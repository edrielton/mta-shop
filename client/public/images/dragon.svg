<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="256" cy="260" r="200" fill="url(#glow)" opacity="0.5">
    <animate attributeName="r" values="180;220;180" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Left wing -->
  <g transform="translate(256,256)" opacity="0.85">
    <path d="M-20,0 C-80,-60 -180,-120 -200,-80 C-220,-40 -160,10 -140,30 C-120,50 -60,40 -20,10Z"
          fill="url(#wingGrad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" values="0;-8;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Wing membrane details -->
    <path d="M-40,-10 C-100,-50 -160,-80 -180,-60" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.4" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0;-8;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M-30,0 C-90,-30 -150,-50 -170,-30" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.3" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0;-8;0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Right wing -->
  <g transform="translate(256,256)" opacity="0.85">
    <path d="M20,0 C80,-60 180,-120 200,-80 C220,-40 160,10 140,30 C120,50 60,40 20,10Z"
          fill="url(#wingGrad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" values="0;8;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M40,-10 C100,-50 160,-80 180,-60" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.4" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0;8;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M30,0 C90,-30 150,-50 170,-30" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.3" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0;8;0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Body -->
  <g filter="url(#shadow)">
    <!-- Torso -->
    <ellipse cx="256" cy="280" rx="55" ry="70" fill="url(#bodyGrad)" stroke="#4338ca" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Chest scales -->
    <ellipse cx="256" cy="265" rx="35" ry="45" fill="#312e81" opacity="0.6"/>
    <!-- Belly pattern -->
    <path d="M240,240 Q256,230 272,240 Q268,260 256,270 Q244,260 240,240Z" fill="#4338ca" opacity="0.3"/>

    <!-- Neck -->
    <path d="M240,230 C235,200 240,170 256,155 C272,170 277,200 272,230Z" fill="url(#bodyGrad)" stroke="#4338ca" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Head -->
    <path d="M230,160 C230,140 240,125 256,120 C272,125 282,140 282,160 C282,175 270,185 256,188 C242,185 230,175 230,160Z" fill="url(#bodyGrad)" stroke="#4338ca" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Horns -->
    <path d="M238,135 C230,115 225,95 220,80" stroke="#4338ca" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M274,135 C282,115 287,95 292,80" stroke="#4338ca" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Horn tips glow -->
    <circle cx="220" cy="80" r="3" fill="#6366f1" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="292" cy="80" r="3" fill="#6366f1" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </path>

    <!-- Snout -->
    <path d="M244,165 C248,172 264,172 268,165" stroke="#4338ca" stroke-width="1" fill="none" stroke-opacity="0.5"/>
    <!-- Nostrils -->
    <circle cx="250" cy="168" r="2" fill="#1e1b4b"/>
    <circle cx="262" cy="168" r="2" fill="#1e1b4b"/>
    <!-- Breath smoke -->
    <g opacity="0.4">
      <circle cx="256" cy="178" r="4" fill="#6366f1" filter="url(#blur2)">
        <animate attributeName="cy" values="178;160;140" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.2;0" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;8;12" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="252" cy="180" r="3" fill="#a855f7" filter="url(#blur2)">
        <animate attributeName="cy" values="180;155;130" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="opacity" values="0.4;0.15;0" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="r" values="2;7;10" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="260" cy="179" r="3" fill="#818cf8" filter="url(#blur2)">
        <animate attributeName="cy" values="179;158;135" dur="2.2s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="opacity" values="0.45;0.18;0" dur="2.2s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="r" values="2;6;9" dur="2.2s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
    </g>

    <!-- Eyes -->
    <ellipse cx="245" cy="148" rx="6" ry="5" fill="#1e1b4b"/>
    <ellipse cx="267" cy="148" rx="6" ry="5" fill="#1e1b4b"/>
    <!-- Pupils -->
    <ellipse cx="246" cy="148" rx="2.5" ry="4" fill="url(#eyeGlow)">
      <animate attributeName="ry" values="4;2;4" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="268" cy="148" rx="2.5" ry="4" fill="url(#eyeGlow)">
      <animate attributeName="ry" values="4;2;4" dur="4s" repeatCount="indefinite" begin="0.2s"/>
    </ellipse>
    <!-- Eye glow -->
    <circle cx="245" cy="148" r="10" fill="#6366f1" opacity="0.3" filter="url(#blur2)">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="267" cy="148" r="10" fill="#6366f1" opacity="0.3" filter="url(#blur2)">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>

    <!-- Front legs -->
    <path d="M225,310 C218,340 215,370 210,390 C208,395 215,398 220,395 L230,385 C232,380 228,370 230,350 L235,320Z" fill="url(#bodyGrad)" stroke="#4338ca" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M287,310 C294,340 297,370 302,390 C304,395 297,398 292,395 L282,385 C280,380 284,370 282,350 L277,320Z" fill="url(#bodyGrad)" stroke="#4338ca" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Claws -->
    <path d="M208,392 L205,400 M212,394 L210,402 M216,395 L215,402" stroke="#4338ca" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M304,392 L307,400 M300,394 L302,402 M296,395 L297,402" stroke="#4338ca" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Tail -->
    <path d="M256,345 C256,370 280,400 300,420 C320,440 350,450 370,445 C360,455 340,452 320,440 C300,428 275,400 260,370Z"
          fill="url(#bodyGrad)" stroke="#4338ca" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Tail tip -->
    <path d="M370,445 L385,440 L375,455Z" fill="#4338ca" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0,370,445;10,370,445;0,370,445;-5,370,445;0,370,445" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Magic particles -->
  <g opacity="0.7">
    <circle cx="200" cy="200" r="2" fill="#a855f7">
      <animate attributeName="cx" values="200;180;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;160;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="312" cy="190" r="1.5" fill="#6366f1">
      <animate attributeName="cx" values="312;330;312" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="cy" values="190;150;190" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="180" cy="280" r="1.8" fill="#818cf8">
      <animate attributeName="cx" values="180;160;180" dur="3.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="cy" values="280;240;280" dur="3.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="330" cy="270" r="1.5" fill="#c084fc">
      <animate attributeName="cx" values="330;350;330" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="cy" values="270;230;270" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="256" cy="130" r="2" fill="#6366f1">
      <animate attributeName="cy" values="130;100;130" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="230" cy="320" r="1.2" fill="#a855f7">
      <animate attributeName="cx" values="230;210;230" dur="4s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="cy" values="320;280;320" dur="4s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="282" cy="310" r="1.3" fill="#818cf8">
      <animate attributeName="cx" values="282;300;282" dur="3.2s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="cy" values="310;270;310" dur="3.2s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="3.2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
  </g>

  <!-- Energy ring -->
  <ellipse cx="256" cy="300" rx="120" ry="20" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.2">
    <animate attributeName="rx" values="100;140;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="256" cy="300" rx="90" ry="15" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.15">
    <animate attributeName="rx" values="80;110;80" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </ellipse>
</svg>
